<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Norbu profile placeholder</title>
  <desc id="desc">A neutral abstract placeholder for a practitioner profile without a photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f1"/>
      <stop offset="0.52" stop-color="#f8f5ee"/>
      <stop offset="1" stop-color="#dbe7ea"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f42"/>
      <stop offset="1" stop-color="#7daaa4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#122f32" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="720" cy="170" r="190" fill="#ffffff" opacity="0.45"/>
  <circle cx="155" cy="1040" r="260" fill="#1f625d" opacity="0.08"/>
  <path d="M156 352c115-104 227-156 337-156 96 0 179 39 251 118" fill="none" stroke="#1f625d" stroke-width="22" stroke-linecap="round" opacity="0.18"/>
  <path d="M170 457c94-78 190-117 288-117 112 0 207 48 286 144" fill="none" stroke="#c96f42" stroke-width="16" stroke-linecap="round" opacity="0.22"/>
  <g filter="url(#shadow)">
    <rect x="270" y="430" width="360" height="360" rx="96" fill="#ffffff" opacity="0.88"/>
    <rect x="315" y="475" width="270" height="270" rx="72" fill="url(#mark)"/>
    <text x="450" y="637" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="136" font-weight="800" fill="#ffffff">N</text>
  </g>
  <text x="450" y="875" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#123f42">Profile photo pending</text>
  <text x="450" y="927" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#657977">Norbu directory listing</text>
</svg>
